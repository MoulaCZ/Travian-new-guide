<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1510;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0c09;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f0a820;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#f0a820;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#f0a820;stop-opacity:0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="780" height="330" fill="url(#bgGrad)" rx="12"/>
  <rect width="780" height="330" fill="none" stroke="#3e3226" stroke-width="1.5" rx="12"/>

  <!-- Title -->
  <rect width="780" height="2" y="48" fill="url(#goldLine)"/>
  <text x="390" y="32" text-anchor="middle" font-size="14" font-weight="700" fill="#f0a820" letter-spacing="3" font-family="Georgia, serif">DEFENSIVE UNIT RECOMMENDATIONS</text>

  <!-- ─── GAULS column ─── -->
  <rect x="16" y="60" width="236" height="254" rx="8" fill="#0d180d" stroke="#2a4a2a" stroke-width="1.5"/>
  <!-- Tribe header -->
  <rect x="16" y="60" width="236" height="38" rx="8" fill="#163016"/>
  <rect x="16" y="86" width="236" height="12" fill="#163016"/>
  <text x="134" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#4ade80">🛡 Gauls</text>

  <!-- Phalanx card -->
  <rect x="28" y="108" width="212" height="90" rx="6" fill="#112011" stroke="#2a3a2a" stroke-width="1"/>
  <text x="44" y="129" font-size="12" font-weight="700" fill="#86efac">Phalanx</text>
  <text x="228" y="129" text-anchor="end" font-size="10" fill="#5a4930">70% of army</text>
  <rect x="28" y="133" width="212" height="1" fill="#1e3020"/>
  <text x="44" y="150" font-size="10" fill="#7a6a55">DEF vs infantry</text>
  <rect x="150" y="143" width="80" height="10" rx="5" fill="#1a2a1a"/>
  <rect x="150" y="143" width="44" height="10" rx="5" fill="#22c55e" opacity="0.7"/>
  <text x="236" y="152" text-anchor="end" font-size="9" fill="#4ade80">55</text>
  <text x="44" y="170" font-size="10" fill="#7a6a55">DEF vs cavalry</text>
  <rect x="150" y="163" width="80" height="10" rx="5" fill="#1a2a1a"/>
  <rect x="150" y="163" width="32" height="10" rx="5" fill="#22c55e" opacity="0.5"/>
  <text x="236" y="172" text-anchor="end" font-size="9" fill="#4ade80">40</text>
  <text x="44" y="192" font-size="10" fill="#f0a820">⚡ cheap · fast to produce</text>

  <!-- Druidrider card -->
  <rect x="28" y="208" width="212" height="90" rx="6" fill="#112011" stroke="#2a3a2a" stroke-width="1"/>
  <text x="44" y="229" font-size="12" font-weight="700" fill="#86efac">Druidrider</text>
  <text x="228" y="229" text-anchor="end" font-size="10" fill="#5a4930">30% of army</text>
  <rect x="28" y="233" width="212" height="1" fill="#1e3020"/>
  <text x="44" y="250" font-size="10" fill="#7a6a55">DEF vs infantry</text>
  <rect x="150" y="243" width="80" height="10" rx="5" fill="#1a2a1a"/>
  <rect x="150" y="243" width="36" height="10" rx="5" fill="#22c55e" opacity="0.5"/>
  <text x="236" y="252" text-anchor="end" font-size="9" fill="#4ade80">45</text>
  <text x="44" y="270" font-size="10" fill="#7a6a55">DEF vs cavalry</text>
  <rect x="150" y="263" width="80" height="10" rx="5" fill="#1a2a1a"/>
  <rect x="150" y="263" width="64" height="10" rx="5" fill="#22c55e" opacity="0.8"/>
  <text x="236" y="272" text-anchor="end" font-size="9" fill="#4ade80">80</text>
  <text x="44" y="292" font-size="10" fill="#f0a820">⚡ anti-cavalry specialist</text>

  <!-- ─── ROMANS column ─── -->
  <rect x="268" y="60" width="244" height="254" rx="8" fill="#1a0f0f" stroke="#4a2a2a" stroke-width="1.5"/>
  <!-- Tribe header -->
  <rect x="268" y="60" width="244" height="38" rx="8" fill="#301616"/>
  <rect x="268" y="86" width="244" height="12" fill="#301616"/>
  <text x="390" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#f87171">⚔ Romans</text>

  <!-- Praetorian card -->
  <rect x="280" y="108" width="220" height="90" rx="6" fill="#201414" stroke="#3a2a2a" stroke-width="1"/>
  <text x="296" y="129" font-size="12" font-weight="700" fill="#fca5a5">Praetorian</text>
  <text x="488" y="129" text-anchor="end" font-size="10" fill="#5a4930">100% of army</text>
  <rect x="280" y="133" width="220" height="1" fill="#2e1e1e"/>
  <text x="296" y="150" font-size="10" fill="#7a6a55">DEF vs infantry</text>
  <rect x="402" y="143" width="80" height="10" rx="5" fill="#2a1a1a"/>
  <rect x="402" y="143" width="52" height="10" rx="5" fill="#ef4444" opacity="0.8"/>
  <text x="488" y="152" text-anchor="end" font-size="9" fill="#fca5a5">65</text>
  <text x="296" y="170" font-size="10" fill="#7a6a55">DEF vs cavalry</text>
  <rect x="402" y="163" width="80" height="10" rx="5" fill="#2a1a1a"/>
  <rect x="402" y="163" width="28" height="10" rx="5" fill="#ef4444" opacity="0.5"/>
  <text x="488" y="172" text-anchor="end" font-size="9" fill="#fca5a5">35</text>
  <text x="296" y="192" font-size="10" fill="#f0a820">⚡ highest infantry DEF in game</text>

  <!-- Romans note card -->
  <rect x="280" y="208" width="220" height="90" rx="6" fill="#1c1212" stroke="#2a2020" stroke-width="1"/>
  <text x="390" y="235" text-anchor="middle" font-size="11" fill="#9d8a6d">Romans are unique — no</text>
  <text x="390" y="255" text-anchor="middle" font-size="11" fill="#9d8a6d">cavalry needed. Praetorian</text>
  <text x="390" y="275" text-anchor="middle" font-size="11" fill="#9d8a6d">covers both roles efficiently.</text>
  <text x="390" y="294" text-anchor="middle" font-size="10" fill="#f0a820">⚡ also: Master Builder bonus</text>

  <!-- ─── TEUTONS column ─── -->
  <rect x="528" y="60" width="236" height="254" rx="8" fill="#0f0f1a" stroke="#2a2a4a" stroke-width="1.5"/>
  <!-- Tribe header -->
  <rect x="528" y="60" width="236" height="38" rx="8" fill="#1a1a30"/>
  <rect x="528" y="86" width="236" height="12" fill="#1a1a30"/>
  <text x="646" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#a78bfa">⚔ Teutons</text>

  <!-- Spearman card -->
  <rect x="540" y="108" width="212" height="90" rx="6" fill="#141420" stroke="#2a2a3a" stroke-width="1"/>
  <text x="556" y="129" font-size="12" font-weight="700" fill="#c4b5fd">Spearman</text>
  <text x="740" y="129" text-anchor="end" font-size="10" fill="#5a4930">75% of army</text>
  <rect x="540" y="133" width="212" height="1" fill="#1e1e30"/>
  <text x="556" y="150" font-size="10" fill="#7a6a55">DEF vs infantry</text>
  <rect x="662" y="143" width="72" height="10" rx="5" fill="#1a1a2a"/>
  <rect x="662" y="143" width="25" height="10" rx="5" fill="#8b5cf6" opacity="0.7"/>
  <text x="740" y="152" text-anchor="end" font-size="9" fill="#c4b5fd">35</text>
  <text x="556" y="170" font-size="10" fill="#7a6a55">DEF vs cavalry</text>
  <rect x="662" y="163" width="72" height="10" rx="5" fill="#1a1a2a"/>
  <rect x="662" y="163" width="43" height="10" rx="5" fill="#8b5cf6" opacity="0.8"/>
  <text x="740" y="172" text-anchor="end" font-size="9" fill="#c4b5fd">60</text>
  <text x="556" y="192" font-size="10" fill="#f0a820">⚡ cheapest · mass-produce</text>

  <!-- Paladin card -->
  <rect x="540" y="208" width="212" height="90" rx="6" fill="#141420" stroke="#2a2a3a" stroke-width="1"/>
  <text x="556" y="229" font-size="12" font-weight="700" fill="#c4b5fd">Paladin</text>
  <text x="740" y="229" text-anchor="end" font-size="10" fill="#5a4930">25% of army</text>
  <rect x="540" y="233" width="212" height="1" fill="#1e1e30"/>
  <text x="556" y="250" font-size="10" fill="#7a6a55">DEF vs infantry</text>
  <rect x="662" y="243" width="72" height="10" rx="5" fill="#1a1a2a"/>
  <rect x="662" y="243" width="47" height="10" rx="5" fill="#8b5cf6" opacity="0.9"/>
  <text x="740" y="252" text-anchor="end" font-size="9" fill="#c4b5fd">65</text>
  <text x="556" y="270" font-size="10" fill="#7a6a55">DEF vs cavalry</text>
  <rect x="662" y="263" width="72" height="10" rx="5" fill="#1a1a2a"/>
  <rect x="662" y="263" width="36" height="10" rx="5" fill="#8b5cf6" opacity="0.7"/>
  <text x="740" y="272" text-anchor="end" font-size="9" fill="#c4b5fd">50</text>
  <text x="556" y="292" font-size="10" fill="#f0a820">⚡ anti-infantry specialist</text>
</svg>
